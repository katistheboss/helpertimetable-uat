<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屋企平日時間表 / Weekly Household Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8E3D2;
    --card:#FBF8F0;
    --ink:#2B3239;
    --ink-soft:#5B6169;
    --clay:#B1503A;
    --sage:#6E8266;
    --sage-soft:#DCE3D6;
    --highlight:#F0C24B;
    --line:#D8D2BC;
    --shadow: 0 2px 6px rgba(43,50,57,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0;
    background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(43,50,57,0.045) 1px, transparent 1px);
    background-size: 16px 16px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding: 24px 16px 60px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    overflow-x: hidden;
  }
  button, input{ touch-action: manipulation; }
  .wrap{ max-width: 780px; margin: 0 auto; }
  header{ text-align:center; margin-bottom: 22px; }
  .lang-switch{
    display:flex; background: var(--card); border-radius: 20px;
    box-shadow: var(--shadow); padding: 3px;
    font-family:'IBM Plex Mono', monospace; font-size: 0.72rem; font-weight: 600;
  }
  .lang-switch button{
    border: none; background: transparent; padding: 8px 12px; border-radius: 16px;
    cursor: pointer; color: var(--ink-soft); transition: background 0.15s ease, color 0.15s ease;
    min-height: 34px;
  }
  .lang-switch button.active{ background: var(--clay); color: #fff; }
  .mode-switch{
    display:flex; background: var(--card); border-radius: 20px;
    box-shadow: var(--shadow); padding: 3px;
    font-family:'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight: 600;
  }
  .mode-switch button{
    border: none; background: transparent; padding: 8px 12px; border-radius: 16px;
    cursor: pointer; color: var(--ink-soft); transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap; min-height: 34px;
  }
  .mode-switch button.active{ background: var(--sage); color: #fff; }
  .mode-banner{
    font-size: 0.74rem; color: var(--ink-soft); text-align:center; margin: -14px 0 18px;
    font-style: italic;
  }
  .view-switch{
    display:flex; gap: 8px; margin: 0 0 20px; background: var(--card);
    border-radius: 10px; padding: 4px; box-shadow: var(--shadow);
  }
  .view-switch button{
    flex:1; border:none; background:transparent; border-radius: 8px; cursor:pointer;
    padding: 12px 10px; font-family:'Kalam', cursive; font-size: 1.05rem; font-weight:700;
    color: var(--ink-soft); transition: background 0.15s ease, color 0.15s ease; min-height: 44px;
  }
  .view-switch button.active{ background: var(--clay); color:#fff; }
  .summary-heading{
    font-family:'Kalam', cursive; font-size: 1.3rem; margin: 0 0 4px; color: var(--ink);
  }
  .todo-days{ display:flex; flex-direction:column; gap: 14px; margin-top: 16px; }
  .todo-day{
    background: var(--card); border-radius: 8px; padding: 14px 16px 16px;
    box-shadow: var(--shadow); border-left: 4px solid var(--clay);
  }
  .todo-day:nth-child(2n){ border-left-color: var(--sage); }
  .todo-day h3{
    font-family:'Kalam', cursive; font-size: 1.1rem; margin: 0 0 8px; color: var(--ink);
  }
  .todo-day h3 .todo-day-sub{ font-size: 0.75rem; font-weight: 400; color: var(--ink-soft); margin-left: 6px; }
  .todo-tasks{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap: 6px; }
  .todo-tasks li{
    font-size: 0.88rem; line-height: 1.4; padding: 6px 0; border-bottom: 1px dashed var(--line);
    display:flex; align-items:center; gap: 8px;
  }
  .todo-tasks li:last-child{ border-bottom:none; }
  .todo-tasks input[type=checkbox]{ width:19px; height:19px; accent-color: var(--sage); cursor:pointer; flex-shrink:0; }
  .todo-tasks .todo-text{ flex:1; }
  .todo-tasks li.done .todo-text{ text-decoration: line-through; opacity: 0.55; }
  .todo-empty{ font-size: 0.82rem; color: var(--ink-soft); font-style: italic; }

  /* ---- row action icons (Ma'am & Sir mode) ---- */
  .row-actions{ display:flex; flex-direction:column; gap: 0; align-items:flex-start; }
  .row-actions button{
    border:none; background:transparent; cursor:pointer; font-size: 0.9rem;
    color: var(--ink-soft); padding: 4px; line-height:1; min-width: 30px; min-height: 26px;
  }
  .row-actions button:hover{ color: var(--clay); }

  /* ---- inline edit form for a task row ---- */
  .edit-row{
    grid-column: 1 / -1; background: var(--sage-soft); border-radius: 6px;
    padding: 10px 12px; display:flex; flex-direction:column; gap: 8px; margin: 4px 0;
  }
  .edit-row .edit-times{ display:flex; gap: 8px; flex-wrap: wrap; }
  .edit-row input[type=text], .edit-row input[type=time]{
    border: 1px solid var(--line); border-radius: 5px; padding: 9px 8px;
    font-family:'IBM Plex Sans', sans-serif; font-size: 0.9rem; background:#fff;
    min-height: 38px;
  }
  .edit-row .edit-times label{ flex:1; min-width: 120px; }
  .edit-row .edit-times input{ width: 100%; }
  .edit-row .edit-text-row{ display:flex; flex-direction:column; gap:6px; }
  .edit-row .edit-text-row input{ width:100%; }
  .edit-row label.fixed-toggle{
    display:flex; align-items:center; gap: 6px; font-size: 0.78rem; color: var(--ink-soft);
  }
  .edit-row .edit-actions{ display:flex; gap: 8px; justify-content:flex-end; }
  .edit-row .edit-actions button{
    border:none; border-radius: 5px; padding: 10px 16px; font-size: 0.82rem; cursor:pointer; font-weight:600;
    min-height: 40px;
  }
  .edit-row .save-btn{ background: var(--clay); color:#fff; }
  .edit-row .cancel-btn{ background: transparent; color: var(--ink-soft); }

  .add-task-btn{
    margin-top: 12px; width:100%; padding: 12px; border: 1px dashed var(--line);
    border-radius: 6px; background: transparent; color: var(--ink-soft); cursor:pointer;
    font-size: 0.85rem; font-family:'IBM Plex Sans', sans-serif; min-height: 44px;
  }
  .add-task-btn:hover{ border-color: var(--clay); color: var(--clay); }
  .panel-header{
    display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; flex-wrap: wrap;
    margin: 0 0 8px; padding-bottom: 10px; border-bottom: 1px dashed var(--line);
  }
  .panel-header .panel-title{ margin:0; padding-bottom:0; border-bottom:none; flex:1; }
  .edit-master-btn{
    flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size: 0.72rem; font-weight:600;
    background: var(--sage-soft); color: #3E4D38; border: none; border-radius: 16px;
    padding: 8px 12px; cursor:pointer; white-space:nowrap; min-height: 34px;
  }
  .edit-master-btn:hover{ background: var(--sage); color:#fff; }
  .instance-hint{
    font-size: 0.74rem; color: var(--clay); margin: -2px 0 10px; font-style: italic;
  }
  .reset-instance-btn{
    font-family:'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight:600;
    background: transparent; color: var(--clay); border: 1px solid var(--clay);
    border-radius: 14px; padding: 8px 14px; cursor:pointer; margin: -2px 0 12px; min-height: 36px;
  }
  .reset-instance-btn:hover{ background: var(--clay); color:#fff; }
  header h1{
    font-family:'Kalam', cursive; font-weight:700; font-size: 2.2rem;
    margin: 8px 0 4px; color: var(--ink); transform: rotate(-1deg);
  }
  header p{ margin:0; color: var(--ink-soft); font-size: 0.9rem; }
  .notes{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin: 24px 0 28px;
  }
  .note{
    background: var(--card); border-radius: 3px; padding: 10px 11px 12px;
    box-shadow: var(--shadow); font-size: 0.78rem; line-height: 1.32;
    position: relative; border-top: 3px solid var(--clay);
  }
  .note:nth-child(2n){ border-top-color: var(--sage); transform: rotate(0.6deg); }
  .note:nth-child(3n){ transform: rotate(-0.7deg); }
  .note:nth-child(5n){ border-top-color: var(--highlight); }
  .note b{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 0.72rem;
    color: var(--clay); margin-bottom: 3px;
  }
  .tabs{ display:flex; gap: 4px; margin-bottom: 0; overflow-x:auto; }
  .tab{
    font-family:'Kalam', cursive; font-size: 1rem; font-weight: 700;
    padding: 12px 16px 10px; background: #D9D3BC; color: var(--ink-soft);
    border: none; border-radius: 8px 8px 0 0; cursor: pointer; position: relative;
    top: 2px; transition: transform 0.15s ease, background 0.15s ease; white-space: nowrap;
    min-height: 44px;
  }
  .tab .sub{
    display:block; font-family:'IBM Plex Sans', sans-serif; font-weight: 500;
    font-size: 0.6rem; color: inherit; opacity: 0.75;
  }
  .tab .tab-date{
    font-family:'IBM Plex Mono', monospace; font-weight: 500; font-size: 0.62rem; opacity: 0.7;
  }
  .tab.active{ background: var(--card); color: var(--ink); top: 0; box-shadow: 0 -2px 4px rgba(43,50,57,0.05); }
  .tab.is-today::after{
    content: ''; position:absolute; top: 6px; right: 6px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--clay);
  }
  .panel{
    background: var(--card); border-radius: 0 6px 6px 6px; box-shadow: var(--shadow);
    padding: 20px 20px 8px;
  }
  .panel-title{
    font-size: 0.76rem; color: var(--ink-soft); margin: 0 0 8px;
    padding-bottom: 10px; border-bottom: 1px dashed var(--line);
  }
  .panel-note{
    font-size: 0.74rem; color: var(--clay); margin: 0 0 10px; font-style: italic;
  }
  .timeline{ list-style:none; margin:0; padding:0; }
  .row{
    display:grid; grid-template-columns: 110px 1fr; gap: 14px; padding: 9px 0;
    border-bottom: 1px solid var(--line); align-items: baseline; position: relative;
  }
  .row:last-child{ border-bottom: none; }
  .row .time{
    font-family:'IBM Plex Mono', monospace; font-size: 0.72rem;
    color: var(--ink-soft); line-height: 1.4; padding-top: 2px;
  }
  .row .task{ font-size: 0.9rem; line-height: 1.42; }
  .row.fixed .task{ font-weight: 600; }
  .row.fixed .time{ color: var(--clay); }
  .row.fixed::before{
    content: '📌'; position: absolute; left: -18px; top: 9px; font-size: 0.68rem; opacity: 0.85;
  }
  .row.is-now{
    background: linear-gradient(90deg, rgba(240,194,75,0.35), rgba(240,194,75,0.08));
    border-radius: 6px; margin: 0 -10px; padding: 9px 10px;
  }
  .row.adhoc-row{ background: rgba(110,130,102,0.08); border-radius: 6px; margin: 0 -10px; padding: 9px 10px; }
  .row.adhoc-row.is-now{
    background: linear-gradient(90deg, rgba(240,194,75,0.35), rgba(110,130,102,0.12));
  }
  .row.adhoc-row .time{ color: var(--sage); }
  .now-tag{
    display:inline-flex; align-items:center; gap:5px; margin-left: 8px;
    font-family:'IBM Plex Mono', monospace; font-size: 0.64rem; color: var(--clay);
    font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .now-dot{
    width: 6px; height:6px; border-radius:50%; background: var(--clay);
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.4; transform:scale(1.3); } }

  /* ---- header controls ---- */
  .header-controls{
    display:flex; gap: 6px; align-items:center; flex-wrap: wrap;
    justify-content:flex-end; width: 100%; margin-bottom: 14px;
  }
  .log-btn{
    font-family:'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight: 600;
    background: var(--card); color: var(--ink-soft); border: none;
    border-radius: 20px; padding: 9px 12px; box-shadow: var(--shadow); cursor: pointer;
    display:flex; align-items:center; gap: 4px; min-height: 34px;
  }
  .log-btn:hover{ color: var(--clay); }

  /* ---- checkboxes on task rows ---- */
  .row{ grid-template-columns: 26px 110px 1fr; }
  .timeline.mode-mgmt .row{ grid-template-columns: 46px 110px 1fr; }
  .row .check{
    display:flex; align-items:flex-start; padding-top: 3px;
  }
  .row .check input{
    width: 20px; height: 20px; accent-color: var(--sage); cursor: pointer;
  }
  .row .check input:disabled{ cursor: not-allowed; opacity: 0.35; }
  .row.done .task{ text-decoration: line-through; opacity: 0.55; }
  .row.fixed::before{ display:none; }

  /* ---- ad-hoc task section ---- */
  .adhoc-box{
    margin: 18px 0 12px; padding-top: 16px; border-top: 1px dashed var(--line);
  }
  .adhoc-box h2{
    font-family:'Kalam', cursive; font-size: 1rem; margin: 0 0 10px; color: var(--ink);
  }
  .adhoc-hint{ font-size: 0.74rem; color: var(--ink-soft); margin: -6px 0 10px; font-style: italic; }
  .adhoc-form{ display:flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .adhoc-form input[type=text]{
    flex:1; min-width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font-family:'IBM Plex Sans', sans-serif; font-size: 0.88rem; background: #fff;
  }
  .adhoc-form input[type=time]{
    width: 100px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px;
    font-family:'IBM Plex Mono', monospace; font-size: 0.82rem; background: #fff;
  }
  .adhoc-form button{
    background: var(--clay); color:#fff; border:none; border-radius: 6px;
    padding: 10px 16px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space:nowrap;
    min-height: 40px;
  }
  .adhoc-list{ list-style:none; margin:0; padding:0; }
  .adhoc-list li{
    display:flex; align-items:center; gap: 10px; padding: 8px 0;
    border-bottom: 1px dashed var(--line); font-size: 0.88rem;
  }
  .adhoc-list li:last-child{ border-bottom:none; }
  .adhoc-list input[type=checkbox]{ width:20px; height:20px; accent-color: var(--sage); cursor:pointer; flex-shrink:0; }
  .adhoc-list .adhoc-time{
    font-family:'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--clay); font-weight:600;
    min-width: 44px;
  }
  .adhoc-list .adhoc-text{ flex:1; }
  .adhoc-list li.done .adhoc-text{ text-decoration: line-through; opacity: 0.55; }
  .adhoc-list .del-btn{
    border:none; background:transparent; color: var(--ink-soft); cursor:pointer; font-size: 1.1rem;
    line-height: 1; padding: 6px; min-width: 32px; min-height: 32px;
  }
  .adhoc-list .del-btn:hover{ color: var(--clay); }
  .adhoc-empty{ font-size: 0.82rem; color: var(--ink-soft); font-style: italic; }

  /* ---- log modal ---- */
  .modal-overlay{
    position: fixed; inset: 0; background: rgba(43,50,57,0.45);
    display:none; align-items:center; justify-content:center; padding: 20px; z-index: 50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--card); border-radius: 10px; max-width: 480px; width:100%;
    max-height: 80vh; overflow-y:auto; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .modal.modal-wide{ max-width: 620px; }
  .modal .timeline{ margin-top: 10px; }
  .modal h2{ font-family:'Kalam', cursive; font-size: 1.2rem; margin: 0 0 4px; }
  .modal .modal-sub{ font-size: 0.76rem; color: var(--ink-soft); margin: 0 0 14px; }
  .modal-close{
    float:right; border:none; background:transparent; font-size: 1.5rem; cursor:pointer;
    color: var(--ink-soft); line-height: 1; padding: 6px; min-width: 40px; min-height: 40px;
  }
  .log-item{ padding: 9px 0; border-bottom: 1px solid var(--line); }
  .log-item:last-child{ border-bottom:none; }
  .log-item .lt-task{ font-size: 0.86rem; font-weight: 600; margin-bottom: 2px; }
  .log-item .lt-meta{ font-size: 0.76rem; color: var(--ink-soft); }
  .log-loading{ font-size: 0.82rem; color: var(--ink-soft); text-align:center; padding: 20px 0; }
  .log-filters{
    display:flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; padding-bottom: 12px;
    border-bottom: 1px dashed var(--line); align-items:center;
  }
  .log-filters select, .log-filters input[type=date]{
    font-family:'IBM Plex Sans', sans-serif; font-size: 0.76rem; padding: 7px 8px;
    border: 1px solid var(--line); border-radius: 6px; background:#fff; color: var(--ink);
    min-height: 36px;
  }
  .log-filters button{
    background: var(--clay); color:#fff; border:none; border-radius: 6px;
    padding: 8px 14px; font-size: 0.78rem; font-weight:600; cursor:pointer; min-height: 36px;
  }
  .log-filters .lf-date-sep{ font-size: 0.74rem; color: var(--ink-soft); }
  .lt-action-completed{ color: var(--sage); font-weight:600; }
  .lt-action-uncompleted{ color: var(--clay); font-weight:600; }

  footer{ text-align:center; margin-top: 24px; font-size: 0.76rem; color: var(--ink-soft); }
  footer .foot-note{
    display:inline-block; background: var(--sage-soft); color: #3E4D38;
    padding: 8px 14px; border-radius: 20px; margin-top: 6px; max-width: 560px;
  }
  @media (max-width: 600px){
    .modal-overlay{ padding: 10px; align-items:flex-end; }
    .modal{ max-height: 88vh; border-radius: 14px 14px 0 0; padding: 18px 16px; }
    .modal.modal-wide{ max-width: 100%; }
  }
  @media (max-width: 480px){
    .header-controls{ justify-content:center; margin-bottom: 8px; }
    header h1{ font-size: 1.6rem; }
    .row{ grid-template-columns: 24px 74px 1fr; gap: 8px; }
    .timeline.mode-mgmt .row{ grid-template-columns: 34px 74px 1fr; gap: 8px; }
    .panel{ padding: 16px 14px 6px; }
    .notes{ grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .adhoc-form input[type=time]{ width: 100%; order: 1; }
    .adhoc-form input[type=text]{ order: 2; min-width: 100%; }
    .adhoc-form button{ order: 3; width: 100%; }
    .row .time{ font-size: 0.68rem; }
    .row .task{ font-size: 0.86rem; }
    .tab{ padding: 11px 12px 9px; font-size: 0.92rem; }
    .view-switch{ flex-wrap: wrap; }
    .view-switch button{ font-size: 0.88rem; padding: 10px 6px; min-width: 45%; }
  }
  @media (max-width: 360px){
    .wrap{ max-width: 100%; }
    body{ padding: 16px 10px 50px; }
    .row{ grid-template-columns: 22px 64px 1fr; gap: 6px; }
    .timeline.mode-mgmt .row{ grid-template-columns: 32px 64px 1fr; gap: 6px; }
  }
  @media (hover: none){
    .tab, .lang-switch button, .mode-switch button, .log-btn, .edit-master-btn,
    .row-actions button, .adhoc-list .del-btn, .add-task-btn, .reset-instance-btn,
    .adhoc-form button, .edit-row .edit-actions button{
      -webkit-tap-highlight-color: transparent;
    }
  }
  @media (prefers-reduced-motion: reduce){ .now-dot{ animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-controls">
      <button class="log-btn" id="logBtn">📊 <span id="logBtnLabel"></span></button>
      <div class="mode-switch" id="modeSwitch">
        <button data-mode="mgmt">👫 <span id="modeMgmtLabel"></span></button>
        <button data-mode="vanessa">🧹 <span id="modeVanessaLabel"></span></button>
      </div>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="zh">中文</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
    <h1 id="pageTitle"></h1>
    <p id="pageSub"></p>
    <p id="weekRange" style="margin:4px 0 0;font-size:0.78rem;color:var(--ink-soft);font-family:'IBM Plex Mono', monospace;"></p>
  </header>

  <p class="mode-banner" id="modeBanner"></p>

  <div class="view-switch" id="viewSwitch">
    <button data-view="todo">✅ <span id="viewTodoLabel"></span></button>
    <button data-view="summary">📋 <span id="viewSummaryLabel"></span></button>
    <button data-view="timetable">📅 <span id="viewTimetableLabel"></span></button>
  </div>

  <div id="todoView" style="display:none;">
    <h2 class="summary-heading" id="todoHeading"></h2>
    <div class="todo-days" id="todoDays"></div>
  </div>

  <div id="summaryView" style="display:none;">
    <h2 class="summary-heading" id="summaryHeading"></h2>
    <div class="notes" id="notes"></div>
  </div>


  <div id="timetableView">
    <div class="tabs" id="tabs"></div>
    <div class="panel">
      <div class="panel-header">
        <p class="panel-title" id="panelTitle"></p>
        <button class="edit-master-btn" id="addTaskBtn" style="display:none;">✏️ <span id="addTaskLabel"></span></button>
      </div>
      <p class="panel-note" id="panelNote" style="display:none;"></p>
      <p class="instance-hint" id="instanceHint" style="display:none;"></p>
      <button class="reset-instance-btn" id="resetInstanceBtn" style="display:none;"></button>
      <ul class="timeline" id="timeline"></ul>

// ---- storage helpers (Supabase `kv_store` table is the primary store) ----
// Every key the app uses (daylog:YYYY-MM-DD, adhoc:<day>, tasklog:..., overrides, instances)
// is one row: { key, value (jsonb), updated_at }. Daily tick state lives in `daylog:<date>` rows,
// which are never deleted, so each day's ticks stay on record.
const hasStorage = true;
const memoryStore = {}; // last-resort fallback if the network call fails
const LEGACY_KV_ENDPOINT = '/api/kv'; // old GitHub-backed store, read once to migrate existing data

async function legacyGet(key){
  try{
    const res = await fetch(LEGACY_KV_ENDPOINT + '?key=' + encodeURIComponent(key));
    if(!res.ok) return null;
    const body = await res.json();
    return (body && 'value' in body) ? body.value : null;
  }catch(e){ return null; }
}

async function storageGet(key, shared){
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/kv_store?select=value&key=eq.' + encodeURIComponent(key), {
      headers: SB_HEADERS
    });
    if(!res.ok){
      console.warn('[supabase] read failed', key, res.status, await res.text());
      return memoryStore[key] ?? null;
    }
    const rows = await res.json();
    if(rows.length){
      memoryStore[key] = rows[0].value;
      return rows[0].value;
    }
    // Not in Supabase yet: try the old GitHub-backed store once and copy it across
    const legacy = await legacyGet(key);
    if(legacy !== null && legacy !== undefined){
      await storageSet(key, legacy, shared);
      return legacy;
    }
    return null;
  }catch(e){
    console.warn('[supabase] read error', key, e);
    return memoryStore[key] ?? null;
  }
}

async function storageSet(key, value, shared){
  memoryStore[key] = value; // optimistic local cache in case the write fails
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/kv_store?on_conflict=key', {
      method: 'POST',
      headers: {
        ...SB_HEADERS,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
    });
    if(!res.ok) console.warn('[supabase] write failed', key, res.status, await res.text());
  }catch(e){
    console.warn('[supabase] write error', key, e); // value stays in memoryStore for this session
  }
}

// ---- audit-trail logging (Supabase `task_logs` table) ----
// Every completed/uncompleted checkbox tick is recorded as its own row in the `task_logs`
// table, with day/type/action columns so the log modal can filter across full history.

async function logAuditEvent({ taskKey, dayKey, taskType, taskTextZh, taskTextEn, action }){
  try{
    await fetch(SUPABASE_URL + '/rest/v1/task_logs', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        task_key: taskKey,
        day_key: dayKey,
        task_type: taskType,
        task_text_zh: taskTextZh || '',
        task_text_en: taskTextEn || '',
        action,
        completed_date: todayISO(),
        completed_at: new Date().toISOString()
      })
    }).then(async res => {
      if(!res.ok) console.warn('[supabase] audit log failed', res.status, await res.text());
    });
  }catch(e){ console.warn('[supabase] audit log error', e); }
}

async function fetchAuditLog(filters){
  const params = new URLSearchParams();
  params.set('select', '*');
  params.set('order', 'completed_at.desc');
  params.set('limit', '300');
  if(filters.dayKey) params.set('day_key', 'eq.' + filters.dayKey);
  if(filters.taskType) params.set('task_type', 'eq.' + filters.taskType);
  if(filters.action) params.set('action', 'eq.' + filters.action);
  if(filters.from) params.append('completed_date', 'gte.' + filters.from);
  if(filters.to) params.append('completed_date', 'lte.' + filters.to);
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/task_logs?' + params.toString(), {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
    });
    if(!res.ok){ console.warn('[supabase] audit fetch failed', res.status, await res.text()); return []; }
    return await res.json();
  }catch(e){ return []; }
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

let todayTasks = {}; // regular-task completion, tied to real today's date

async function loadTodayTasks(){
  const data = await storageGet('daylog:'+todayISO(), true);
  todayTasks = (data && data.tasks) || {};
}

async function saveTodayTasks(){
  await storageSet('daylog:'+todayISO(), { tasks: todayTasks }, true);
}

async function toggleTaskDone(taskKey){
  const nowDone = !todayTasks[taskKey];
  if(nowDone){ todayTasks[taskKey] = true; } else { delete todayTasks[taskKey]; }
  await saveTodayTasks();

  // figure out which log key to use — the AC-unit task logs separately per room
  const [dKey, idxStr] = taskKey.split('-');
  const idx = Number(idxStr);
  const dayObj = DAYS.find(d=>d.key===dKey);
  let logKey = 'tasklog:'+taskKey;
  let auditTaskKey = taskKey;
  let taskTextZh = '', taskTextEn = '';
  if(dayObj){
    const row = displayRows(dayObj)[idx];
    if(row){
      taskTextZh = (row[2] && row[2].zh) || '';
      taskTextEn = (row[2] && row[2].en) || '';
      if(isACTask(row[2])){
        const room = acRoomForDay(dayObj);
        logKey = 'tasklog:'+taskKey+'-'+room.en; // room.en used as a stable key, independent of display language
        auditTaskKey = taskKey+'-'+room.en;
        taskTextZh += ' — ' + room.zh;
        taskTextEn += ' — ' + room.en;
      }
    }
  }

  // update per-task log (dedup by date, keep last 30) — kept as-is for backward compatibility
  let log = (await storageGet(logKey, true)) || [];
  const iso = todayISO();
  if(nowDone){
    if(!log.includes(iso)) log.push(iso);
  } else {
    log = log.filter(d => d !== iso);
  }
  log = log.slice(-30);
  await storageSet(logKey, log, true);

  // record a full, filterable audit-trail event in Supabase
  logAuditEvent({
    taskKey: auditTaskKey,
    dayKey: dKey,
    taskType: 'regular',
    taskTextZh, taskTextEn,
    action: nowDone ? 'completed' : 'uncompleted'
  });

  renderDay(activeDayKey);
}

async function addAdhocTask(dayKey, text, time){

  if(!adhocCache[dayKey]) adhocCache[dayKey] = [];
  adhocCache[dayKey].push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), text: text.trim(), time: time || '', done: false });

function toMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function addMinutes(t, mins){
  const total = toMinutes(t) + mins;
  const h = Math.floor(total/60) % 24;
  const m = total % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// ---- current-week date helpers (this view shows the upcoming/current Mon–Sat) ----
function getMondayOfCurrentWeek(){
  const now = new Date();
  const day = now.getDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? 1 : 1 - day;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return monday;
}

function dateForWeekday(weekday){ // weekday: 1=Mon..6=Sat
  const monday = getMondayOfCurrentWeek();
  return new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + (weekday - 1));
}

function formatShortDate(d){
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function weekRangeLabel(){
  const mon = dateForWeekday(1);
  const sat = dateForWeekday(6);
  return `${formatShortDate(mon)} – ${formatShortDate(sat)}`;
}

// ---- AC unit cleaning rotation: master bedroom -> study -> baby room -> living room, one per week ----
const AC_ROOMS = [
  { zh: '主人房', en: 'Master bedroom' },
  { zh: '書房', en: 'Study' },
  { zh: 'BB房', en: 'Baby room' },
  { zh: '客廳', en: 'Living room' },
];
const AC_ROTATION_ANCHOR = new Date(2026, 8, 14); // a Monday; week of this date = 主人房 (index 0)

function isACTask(task){
  return !!(task && task.zh && task.zh.includes('洗一部冷氣'));
}

function acRoomIndexForMonday(mondayDate){
  const msPerWeek = 7*24*60*60*1000;
  const weeks = Math.round((mondayDate - AC_ROTATION_ANCHOR) / msPerWeek);
  return ((weeks % 4) + 4) % 4;
}

function acRoomForDay(day){
  const monday = dateForWeekday(1);
  return AC_ROOMS[acRoomIndexForMonday(monday)];
}

function isoDateForWeekday(weekday){
  const d = dateForWeekday(weekday);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

    noteEl.style.display = 'none';
  }

  await Promise.all([loadOverrideForDay(key), loadInstanceForDay(day), loadAdhocForDay(key)]);
  renderTimeline();
  if(activeDayKey === key) renderAdhoc();
}

function renderTimeline(){
  const day = DAYS.find(d=>d.key===activeDayKey);
  const rows = displayRows(day);
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isToday = now.getDay() === day.weekday;
  const isMgmt = currentMode === 'mgmt';

  const list = document.getElementById('timeline');
  list.classList.toggle('mode-mgmt', isMgmt);

  // merge regular rows with any ad-hoc tasks that have a specific time set
  const adhocTimed = (adhocCache[day.key] || []).filter(a => a.time);
  const merged = [
    ...rows.map((r, idx) => ({ kind:'regular', origIdx: idx, start: r[0], end: r[1], task: r[2], fixed: r[3] })),
    ...adhocTimed.map(a => ({ kind:'adhoc', item: a, start: a.time, end: addMinutes(a.time, 15) })),
  ].sort((a,b) => toMinutes(a.start) - toMinutes(b.start));

  list.innerHTML = merged.map(m => {
    if(m.kind === 'regular'){
      const idx = m.origIdx;
      if(isMgmt && instanceEditingIdx === idx) return renderEditForm(idx, rows[idx], true);

      const {start,end,task,fixed} = m;
      const isNow = isToday && nowMin >= toMinutes(start) && nowMin < toMinutes(end);
      const taskKey = day.key+'-'+idx;
      const isDone = isToday && !!todayTasks[taskKey];
      const pin = fixed ? '📌 ' : '';
      const acSuffix = isACTask(task) ? ` — <b>${acRoomForDay(day)[currentLang]}</b>` : '';

      const leftCell = isMgmt
        ? `<span class="row-actions">
             <button class="edit-btn" data-idx="${idx}" aria-label="${STRINGS[currentLang].editBtn}">✏️</button>
             <button class="delrow-btn" data-idx="${idx}" aria-label="${STRINGS[currentLang].delBtn}">✕</button>
           </span>`
        : `<span class="check"><input type="checkbox" ${isDone?'checked':''} ${isToday?'':'disabled'} data-taskkey="${taskKey}"></span>`;

      return `
        <li class="row ${fixed?'fixed':''} ${isNow?'is-now':''} ${isDone?'done':''}">
          ${leftCell}
          <span class="time">${start}–${end}</span>
          <span class="task">${pin}${task[currentLang]}${acSuffix}${isNow?`<span class="now-tag"><span class="now-dot"></span>${STRINGS[currentLang].now}</span>`:''}</span>
        </li>
      `;
    } else {
      // ad-hoc task merged into the timeline
      const item = m.item;
      const isNow = isToday && nowMin >= toMinutes(m.start) && nowMin < toMinutes(m.end);
      const leftCell = isMgmt
        ? `<span class="row-actions"><button class="del-adhoc-inline" data-id="${item.id}" aria-label="${STRINGS[currentLang].delAria}">✕</button></span>`
        : `<span class="check"><input type="checkbox" ${item.done?'checked':''} data-adhoc-inline-id="${item.id}"></span>`;
      return `
        <li class="row adhoc-row ${isNow?'is-now':''} ${item.done?'done':''}">
          ${leftCell}
          <span class="time">${m.start}–${m.end}</span>
          <span class="task">📝 ${item.text}${isNow?`<span class="now-tag"><span class="now-dot"></span>${STRINGS[currentLang].now}</span>`:''}</span>
        </li>
      `;
    }
  }).join('') + (isMgmt && instanceEditingIdx === rows.length ? renderEditForm(rows.length, null, true) : '');

  if(!isMgmt){
    list.querySelectorAll('input[type=checkbox][data-taskkey]').forEach(cb=>{
      cb.addEventListener('change', ()=> toggleTaskDone(cb.dataset.taskkey));
    });
    list.querySelectorAll('input[type=checkbox][data-adhoc-inline-id]').forEach(cb=>{
      cb.addEventListener('change', ()=> toggleAdhocDone(day.key, cb.dataset.adhocInlineId));
    });
  } else {
    list.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ instanceEditingIdx = Number(btn.dataset.idx); renderTimeline(); });
    });
    list.querySelectorAll('.delrow-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteInstanceRow(Number(btn.dataset.idx)));
    });
    list.querySelectorAll('.del-adhoc-inline').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteAdhocTask(day.key, btn.dataset.id));
    });
    wireInstanceEditForm();
  }

  const resetBtn = document.getElementById('resetInstanceBtn');
  if(resetBtn) resetBtn.style.display = (isMgmt && hasInstanceOverride(day)) ? 'inline-block' : 'none';
}

function renderEditForm(idx, row){
  const [start,end,task,fixed] = row || ['09:00','10:00',{zh:'',en:''},false];
  return `
    <li class="edit-row" data-editidx="${idx}">
      <div class="edit-times">
        <label style="display:block;font-size:0.72rem;color:var(--ink-soft);">${STRINGS[currentLang].formStart}
          <input type="time" id="editStart" value="${start}">
        </label>
        <label style="display:block;font-size:0.72rem;color:var(--ink-soft);">${STRINGS[currentLang].formEnd}
          <input type="time" id="editEnd" value="${end}">
        </label>
      </div>
      <div class="edit-text-row">
        <input type="text" id="editTaskZh" placeholder="${STRINGS[currentLang].formTaskZh}" value="${(task.zh||'').replace(/"/g,'&quot;')}">
        <input type="text" id="editTaskEn" placeholder="${STRINGS[currentLang].formTaskEn}" value="${(task.en||'').replace(/"/g,'&quot;')}">
      </div>
      <label class="fixed-toggle">
        <input type="checkbox" id="editFixed" ${fixed?'checked':''}> ${STRINGS[currentLang].formFixed}
      </label>
      <div class="edit-actions">
        <button class="cancel-btn" id="editCancelBtn">${STRINGS[currentLang].cancelBtn}</button>
        <button class="save-btn" id="editSaveBtn">${STRINGS[currentLang].saveBtn}</button>
      </div>
    </li>
  `;
}

function wireEditForm(){
  const saveBtn = document.getElementById('editSaveBtn');
  const cancelBtn = document.getElementById('editCancelBtn');
  if(saveBtn) saveBtn.addEventListener('click', saveEditForm);
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingIdx = null; renderEditModalList(); });
}

// ---- edit master list modal ----
function renderEditModalList(){
  const day = DAYS.find(d=>d.key===activeDayKey);
  const rows = effectiveRows(day);

  const list = document.getElementById('editTimeline');
  list.innerHTML = rows.map((r, idx)=>{
    if(editingIdx === idx) return renderEditForm(idx, r);

    const [start,end,task,fixed] = r;
    const pin = fixed ? '📌 ' : '';
    return `
      <li class="row ${fixed?'fixed':''}">
        <span class="row-actions">
          <button class="edit-btn" data-idx="${idx}" aria-label="${STRINGS[currentLang].editBtn}">✏️</button>
          <button class="delrow-btn" data-idx="${idx}" aria-label="${STRINGS[currentLang].delBtn}">✕</button>
        </span>
        <span class="time">${start}–${end}</span>
        <span class="task">${pin}${task[currentLang]}</span>
      </li>
    `;
  }).join('') + (editingIdx === rows.length ? renderEditForm(rows.length, null) : '');

  list.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingIdx = Number(btn.dataset.idx); renderEditModalList(); });
  });
  list.querySelectorAll('.delrow-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteTaskRow(Number(btn.dataset.idx)));
  });
  wireEditForm();
}

function openEditModal(){
  const day = DAYS.find(d=>d.key===activeDayKey);
  editingIdx = null;
  instanceEditingIdx = null;
  renderTimeline();
  document.getElementById('editModalTitle').textContent = STRINGS[currentLang].addTaskLabel;
  document.getElementById('editModalSub').textContent = day.title[currentLang];
  document.getElementById('modalAddTaskLabel').textContent = STRINGS[currentLang].addTaskRowLabel;
  renderEditModalList();
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal(){
  editingIdx = null;
  document.getElementById('editModal').classList.remove('open');
  renderTimeline(); // reflect any changes on the main (read-only) view
}

async function saveEditForm(){
  const day = DAYS.find(d=>d.key===activeDayKey);
  const rows = effectiveRows(day).slice(); // copy
  const start = document.getElementById('editStart').value;
  const end = document.getElementById('editEnd').value;
  const zh = document.getElementById('editTaskZh').value.trim();
  const en = document.getElementById('editTaskEn').value.trim();
  const fixed = document.getElementById('editFixed').checked;
  if(!start || !end || (!zh && !en)) return;

  const newRow = [start, end, {zh: zh || en, en: en || zh}, fixed];
  if(editingIdx < rows.length){
    rows[editingIdx] = newRow;
  } else {
    rows.push(newRow);
  }
  // keep the list ordered by start time so a new/edited task lands in its correct slot
  rows.sort((a, b) => toMinutes(a[0]) - toMinutes(b[0]));

  await saveOverrideForDay(day.key, rows);
  editingIdx = null;
  renderEditModalList();
}

async function deleteTaskRow(idx){
  const day = DAYS.find(d=>d.key===activeDayKey);
  const rows = effectiveRows(day).slice();
  rows.splice(idx, 1);
  await saveOverrideForDay(day.key, rows);
  renderEditModalList();
}

// ---- this-week-only inline editing on the main view (does NOT touch the master list) ----
function wireInstanceEditForm(){
  const saveBtn = document.getElementById('editSaveBtn');
  const cancelBtn = document.getElementById('editCancelBtn');
  if(saveBtn) saveBtn.addEventListener('click', saveInstanceEdit);
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ instanceEditingIdx = null; renderTimeline(); });
}

async function saveInstanceEdit(){
  const day = DAYS.find(d=>d.key===activeDayKey);
  const rows = displayRows(day).slice(); // start from whatever's currently shown (instance override or master)
  const start = document.getElementById('editStart').value;
  const end = document.getElementById('editEnd').value;
  const zh = document.getElementById('editTaskZh').value.trim();
  const en = document.getElementById('editTaskEn').value.trim();
  const fixed = document.getElementById('editFixed').checked;
  if(!start || !end || (!zh && !en)) return;

  const newRow = [start, end, {zh: zh || en, en: en || zh}, fixed];
  if(instanceEditingIdx < rows.length){
    rows[instanceEditingIdx] = newRow;
  } else {
    rows.push(newRow);
  }
  rows.sort((a, b) => toMinutes(a[0]) - toMinutes(b[0]));

  await saveInstanceForDay(day, rows);
  instanceEditingIdx = null;
  renderTimeline();
}

async function deleteInstanceRow(idx){
  const day = DAYS.find(d=>d.key===activeDayKey);
  const rows = displayRows(day).slice();
  rows.splice(idx, 1);
  await saveInstanceForDay(day, rows);
  renderTimeline();
}

async function resetInstanceToMaster(){
  const day = DAYS.find(d=>d.key===activeDayKey);
  await clearInstanceForDay(day);
  instanceEditingIdx = null;
  renderTimeline();
}

function setLang(lang){
  currentLang = lang;
  renderHeader();
  renderNotes();
  renderDay(activeDayKey);
  if(currentView === 'todo') renderTodo();
}

function setMode(mode){
  currentMode = mode;
  editingIdx = null;
  renderHeader();
  renderTimeline();
  renderAdhoc();
  if(currentView === 'todo') renderTodo();
}

async function renderTodo(){
  await Promise.all(DAYS.map(d => Promise.all([loadOverrideForDay(d.key), loadInstanceForDay(d)])));
  const now = new Date();
  const todayWeekday = now.getDay();
  const isVanessa = currentMode !== 'mgmt';
  const el = document.getElementById('todoDays');
  el.innerHTML = DAYS.map(day => {
    // keep original row index (matches the taskKey used by the main timeline) so ticking here
    // stays in sync with ticking on the Timetable tab
    const entries = displayRows(day)
      .map((r, idx) => ({ r, idx }))
      .filter(x => x.r[3]);
    const isToday = day.weekday === todayWeekday;
    const tasksHtml = entries.length
      ? `<ul class="todo-tasks">${entries.map(({r, idx}) => {
          const acSuffix = isACTask(r[2]) ? ` — <b>${acRoomForDay(day)[currentLang]}</b>` : '';
          const taskKey = day.key+'-'+idx;
          const isDone = isToday && !!todayTasks[taskKey];
          if(isVanessa){
            return `<li class="${isDone?'done':''}">
              <input type="checkbox" ${isDone?'checked':''} ${isToday?'':'disabled'} data-taskkey="${taskKey}">
              <span class="todo-text">${r[2][currentLang]}${acSuffix}</span>
            </li>`;
          }
          return `<li>📌 ${r[2][currentLang]}${acSuffix}</li>`;
        }).join('')}</ul>`
      : `<p class="todo-empty">${STRINGS[currentLang].todoEmpty}</p>`;
    return `<div class="todo-day"><h3>${day.title[currentLang]}</h3>${tasksHtml}</div>`;
  }).join('');

  if(isVanessa){
    el.querySelectorAll('input[type=checkbox][data-taskkey]').forEach(cb=>{
      cb.addEventListener('change', async ()=>{
        await toggleTaskDone(cb.dataset.taskkey);
        renderTodo();
      });
    });
  }
}

async function setView(view){
  currentView = view;
  renderHeader();
  if(view === 'todo') renderTodo();
}

document.getElementById('langSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  setLang(btn.dataset.lang);
});

document.getElementById('modeSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  setMode(btn.dataset.mode);
});

document.getElementById('viewSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  setView(btn.dataset.view);
});

document.getElementById('addTaskBtn').addEventListener('click', openEditModal);
document.getElementById('resetInstanceBtn').addEventListener('click', resetInstanceToMaster);

document.getElementById('editModalClose').addEventListener('click', closeEditModal);
document.getElementById('editModal').addEventListener('click', (e)=>{
  if(e.target.id === 'editModal') closeEditModal();
});
document.getElementById('modalAddTaskBtn').addEventListener('click', ()=>{
  const day = DAYS.find(d=>d.key===activeDayKey);
  editingIdx = effectiveRows(day).length;
  renderEditModalList();
});

document.getElementById('adhocAddBtn').addEventListener('click', ()=>{
  const input = document.getElementById('adhocInput');
  const timeInput = document.getElementById('adhocTimeInput');
  addAdhocTask(activeDayKey, input.value, timeInput.value);
  input.value = '';
  timeInput.value = '';
});
document.getElementById('adhocInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const timeInput = document.getElementById('adhocTimeInput');
    addAdhocTask(activeDayKey, e.target.value, timeInput.value);
    e.target.value = '';
    timeInput.value = '';
  }
});

// ---- log modal (Supabase-backed audit trail, filterable by day/type/action/date range) ----
function populateLogFilterOptions(){
  const daySel = document.getElementById('logFilterDay');
  daySel.innerHTML = `<option value="">${STRINGS[currentLang].logFilterAllDays}</option>` +
    DAYS.map(d=>`<option value="${d.key}">${d.label[currentLang]}</option>`).join('');
  daySel.value = activeDayKey || '';

  document.getElementById('logFilterType').innerHTML = `
    <option value="">${STRINGS[currentLang].logFilterAllTypes}</option>
    <option value="regular">${STRINGS[currentLang].logFilterRegular}</option>
    <option value="adhoc">${STRINGS[currentLang].logFilterAdhoc}</option>
  `;

  document.getElementById('logFilterAction').innerHTML = `
    <option value="">${STRINGS[currentLang].logFilterAllActions}</option>
    <option value="completed">${STRINGS[currentLang].logActionCompleted}</option>
    <option value="uncompleted">${STRINGS[currentLang].logActionUncompleted}</option>
  `;

  document.getElementById('logFilterBtn').textContent = STRINGS[currentLang].logFilterApply;
}

async function runLogFilter(){
  const body = document.getElementById('logModalBody');
  body.innerHTML = `<div class="log-loading">${STRINGS[currentLang].loading}</div>`;

  const filters = {
    dayKey: document.getElementById('logFilterDay').value,
    taskType: document.getElementById('logFilterType').value,
    action: document.getElementById('logFilterAction').value,
    from: document.getElementById('logFilterFrom').value,
    to: document.getElementById('logFilterTo').value,
  };
  const rows = await fetchAuditLog(filters);

  if(!rows.length){
    body.innerHTML = `<div class="log-loading">${STRINGS[currentLang].logFilterEmpty}</div>`;
    return;
  }

  body.innerHTML = rows.map(r => {
    const taskText = currentLang === 'zh' ? (r.task_text_zh || r.task_text_en) : (r.task_text_en || r.task_text_zh);
    const dayObj = DAYS.find(d=>d.key===r.day_key);
    const dLabel = dayObj ? dayObj.label[currentLang] : r.day_key;
    const actionCls = r.action === 'completed' ? 'lt-action-completed' : 'lt-action-uncompleted';
    const actionLabel = r.action === 'completed' ? STRINGS[currentLang].logActionCompleted : STRINGS[currentLang].logActionUncompleted;
    const when = new Date(r.completed_at).toLocaleString(currentLang==='zh' ? 'zh-HK' : 'en-US', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
    return `
      <div class="log-item">
        <div class="lt-task">${taskText || r.task_key}</div>
        <div class="lt-meta">${dLabel} · <span class="${actionCls}">${actionLabel}</span> · ${when}</div>
      </div>
    `;
  }).join('');
}

async function openLogModal(){
  const modal = document.getElementById('logModal');
  document.getElementById('logModalTitle').textContent = STRINGS[currentLang].logModalTitle;
  document.getElementById('logModalSub').textContent = STRINGS[currentLang].logModalSubAudit;
  populateLogFilterOptions();
  modal.classList.add('open');
  await runLogFilter();
}

document.getElementById('logFilterBtn').addEventListener('click', runLogFilter);
document.getElementById('logBtn').addEventListener('click', openLogModal);
document.getElementById('logModalClose').addEventListener('click', ()=>{
  document.getElementById('logModal').classList.remove('open');
});
document.getElementById('logModal').addEventListener('click', (e)=>{
  if(e.target.id === 'logModal') document.getElementById('logModal').classList.remove('open');
});
async function init(){
  renderHeader();
  renderNotes();
  await loadTodayTasks();
  const todayIdx = new Date().getDay();
  const defaultDay = DAYS.find(d=>d.weekday===todayIdx) || DAYS[0];
  renderDay(defaultDay.key);
  if(currentView === 'todo') renderTodo();
}
init();

setInterval(()=>{ if(activeDayKey) renderDay(activeDayKey); }, 60000);

</script>
